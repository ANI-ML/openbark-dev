# Dependabot version updates. Every pinned version is recorded in
# docs/versions.md with its source: a Dependabot pull request must update that
# file before it merges (CONTRIBUTING.md, Dependencies).
#
# The cooldown keeps new releases out for a week, so a broken or compromised
# release has time to be caught upstream first. Security updates (turned on in
# the repository settings) are not delayed by it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
        # llama-cpp-2 and sherpa-onnx link native code (one ggml and one ONNX
        # Runtime per binary, docs/spikes/S2-native-linking.md). They get pull
        # requests of their own, so each bump is checked separately by CI's
        # symbol check and the evaluation.
        exclude-patterns: ["llama-cpp*", "sherpa-onnx*"]

  - package-ecosystem: npm # pnpm workspace: pnpm-lock.yaml and the catalog in pnpm-workspace.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # jsdom 30 needs Node 24.15 or later; dev machines run 24.14
      # (pnpm-workspace.yaml).
      - dependency-name: jsdom
        versions: [">=30"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
