name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.22.0"

jobs:
  js:
    name: UI (typecheck + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run test

  linux:
    name: Engine (Linux) + offline e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri webview, libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev cmake libasound2-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/ci/check-network.sh
      - name: Install scripts parse
        run: for f in install/*.sh install/*.command; do bash -n "$f"; done
      - run: cargo build --release -p os-cli
      - name: Single ggml / no whisper / one ONNX Runtime (M0-5)
        run: bash scripts/ci/check-symbols.sh target/release/openbark
      - name: Restore models
        id: models
        uses: actions/cache@v4
        with:
          path: ~/models
          key: models-${{ hashFiles('engine/os-models/catalog.json') }}-e2b
      - name: Download models (network allowed here only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          export OPENBARK_MODELS_DIR=~/models
          for id in silero-vad parakeet-tdt-0.6b-v3-int8 pyannote-segmentation-3.0 wespeaker-en-resnet34-lm gemma-4-e2b-it-q4_0; do
            target/release/openbark models pull "$id"
          done
      - name: Offline end-to-end (M0-2, M0-4, M0-6)
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces (AppArmor), which
          # e2e-offline.sh needs for `unshare -rn` (a run with no network at all).
          # Lift that restriction on the runner only; the test itself stays offline.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export OPENBARK_MODELS_DIR=~/models
          target/release/openbark models verify
          bash scripts/ci/e2e-offline.sh target/release/openbark smoke gemma-4-e2b-it-q4_0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: target/e2e

  windows:
    name: Engine (Windows x64, CPU build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-
      - name: libclang (bindgen)
        run: choco install llvm -y --no-progress
      - run: cargo test --workspace --exclude openbark-desktop
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
      - run: cargo build --release -p os-cli
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

  macos:
    name: Engine (macOS arm64, Metal build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - run: cargo test --workspace --exclude openbark-desktop
      - run: cargo build --release -p os-cli --features metal
      - name: Single ggml / no whisper (M0-5)
        run: bash scripts/ci/check-symbols.sh target/release/openbark
