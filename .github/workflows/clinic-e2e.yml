name: Clinic end to end

# Clinics, invites and usage counts (ADR-0028, the hospital dashboard, phase
# 1) through a LOCAL Supabase in Docker on the runner: never the hosted
# project. scripts/clinic-e2e.py drives the REST API and the Edge Functions
# the website portal uses, with five accounts signing in by emailed codes
# (Mailpit): creating a clinic, inviting by email (an existing account and a
# new one), accepting, joining with a code, expired and revoked invites,
# reporting usage (accepted for one's own row, refused otherwise), what each
# person can read, the admin dashboard's sums, the last-admin rule, removing
# a member, deleting accounts, the purge, and a check that the only text
# stored is clinic names, display names and invite addresses. Then the
# website's portal checks (apps/desktop/e2e/website.mjs, every Supabase call
# mocked) and the portal's clinic pages driven in Chromium against the local
# Supabase (apps/desktop/e2e/portal-clinic.mjs: the page's calls to the hosted
# address are answered from the local stack, never sent there).
#
# No app build and no models: the app doesn't take part in phase 1. Run it
# from the Actions tab, or push a commit whose message contains [clinic-e2e].
# It never runs in the public copy of the source.

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "fix/**", "release/**", "chore/**", "design/**"]

permissions:
  contents: read

concurrency:
  group: clinic-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.0"
  SUPABASE_CLI_VERSION: "2.121.0"
  SUPABASE_CLI_SHA256: "4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f"

jobs:
  clinic:
    name: Clinics, invites and usage through a local Supabase
    if: github.repository == 'ANI-ML/openbark-dev' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[clinic-e2e]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Supabase CLI (pinned, hash-checked; docs/versions.md)
        run: |
          f="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/$f"
          echo "${SUPABASE_CLI_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar -xzf "$RUNNER_TEMP/$f" -C ~/.local/bin supabase
          ~/.local/bin/supabase --version
      - name: psql (for the checks that need the database itself)
        run: command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Local Supabase
        run: bash scripts/sync-local-supabase.sh start
      - name: The Edge Functions answer
        run: |
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/clinic-invite || true)
            [ "$code" = "204" ] && { echo "clinic-invite answers"; exit 0; }
            sleep 1
          done
          echo "clinic-invite isn't served (last status $code)"; exit 1
      - name: Clinic end-to-end steps
        shell: bash
        run: |
          set -o pipefail
          eval "$(bash scripts/sync-local-supabase.sh env)"
          mkdir -p target/clinic-e2e
          python3 -I scripts/clinic-e2e.py | tee target/clinic-e2e/steps.log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Website checks (the portal with its clinic pages; Supabase mocked)
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          corepack enable
          pnpm install --frozen-lockfile
          (cd apps/desktop && npx playwright install --with-deps chromium)
          mkdir -p target/clinic-e2e
          python3 -m http.server -d website/dist 8099 > target/clinic-e2e/http.log 2>&1 &
          for _ in $(seq 1 50); do curl -fs http://localhost:8099/portal.html > /dev/null && break; sleep 0.2; done
          cd apps/desktop
          OUT_DIR=../../target/clinic-e2e/website node e2e/website.mjs | tee ../../target/clinic-e2e/website.log
      - name: The portal's clinic pages against the local Supabase
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          eval "$(bash scripts/sync-local-supabase.sh env)"
          curl -fs http://localhost:8099/portal.html > /dev/null || { python3 -m http.server -d website/dist 8099 > target/clinic-e2e/http.log 2>&1 & sleep 1; }
          cd apps/desktop
          OUT_DIR=../../target/clinic-e2e/portal node e2e/portal-clinic.mjs | tee ../../target/clinic-e2e/portal.log
      - name: Step summary
        if: always()
        run: |
          [ -f target/clinic-e2e/steps.log ] || exit 0
          { echo '### Clinic end to end'; echo '```'; cat target/clinic-e2e/steps.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for f in website portal; do
            [ -f "target/clinic-e2e/$f.log" ] && { echo "### $f"; echo '```'; cat "target/clinic-e2e/$f.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - name: Service logs
        if: failure()
        run: |
          mkdir -p target/clinic-e2e
          for c in edge_runtime auth rest db kong; do
            docker logs "supabase_${c}_openbark-sync-dev" > "target/clinic-e2e/${c}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # Synthetic accounts and logs only.
          name: clinic-e2e
          path: target/clinic-e2e/
