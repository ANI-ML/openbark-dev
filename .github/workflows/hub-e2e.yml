name: Hub end to end

# Encrypted sync through a clinic hub (ADR-0029 section 11): no Docker and no
# Supabase. Three OpenBark servers on one runner: the hub (a desktop with hub
# mode on), a phone (the iPhone profile, an 8 GB iPhone) that records, and a
# second computer that drafts and signs, joined by the hub's address over
# loopback. scripts/hub-e2e.py drives them with the same HTTP API the app
# uses: join codes (one from the QR code's link, one typed with the
# certificate check), the Recovery Kit, pairing, a visit from the phone
# arriving transcribed without its audio, the signed note coming back, both
# offline with conflicting edits, conflicting offline drafts, the hub
# restarted, removing a device, recovering from the kit, and a check that the
# hub holds ciphertext only. Then it attacks the hub's listener with a client
# of its own: a wrong certificate, unsigned and badly signed requests, a
# replayed nonce, missing, used and expired join codes, the lockout, another
# account's data, a removed device, the quota, the rate limits and a client
# address outside the allowed ranges.
#
# Synthetic data only: the committed smoke consult. Run it from the Actions
# tab, or push a commit whose message contains [hub-e2e]. It never runs in
# the public copy of the source.

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "fix/**", "release/**", "chore/**", "design/**"]

permissions:
  contents: read

concurrency:
  group: hub-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hub:
    name: Hub, phone and computer on one runner
    if: github.repository == 'ANI-ML/openbark-dev' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hub-e2e]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages (libclang, ALSA; Python's cryptography for the attack client)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libasound2-dev python3-cryptography
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-hub-e2e/${{ github.repository }}/${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-hub-e2e/${{ github.repository }}/
            cargo-sync-e2e/${{ github.repository }}/
            cargo-linux/${{ github.repository }}/
      - run: cargo build --release -p os-cli
      - name: Restore models
        id: models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/models
          key: models-${{ hashFiles('engine/os-models/catalog.json') }}-e2b
      - name: Download models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          export OPENBARK_MODELS_DIR=~/models
          for id in silero-vad parakeet-tdt-0.6b-v3-int8 pyannote-segmentation-3.0 wespeaker-en-resnet34-lm gemma-4-e2b-it-q4_0; do
            target/release/openbark models pull "$id"
          done
      - name: Hub, phone (A) and computer (B), then the end-to-end steps
        shell: bash
        run: |
          demo="$PWD/target/hub-e2e"
          rm -rf "$demo" && mkdir -p "$demo/ui" && touch "$demo/OPENBARK-DEMO"
          # The test drives the HTTP API only; the server just needs a page to serve.
          echo '<!doctype html><title>OpenBark</title>' > "$demo/ui/index.html"
          # The hub's data key is kept: a restart must open the same store, and
          # the ciphertext check opens it as the server role does.
          hub_key="$(head -c 32 /dev/urandom | base64)"
          start() {
            local name=$1 port=$2; shift 2
            mkdir -p "$demo/$name"
            env OPENBARK_SESSIONS_DIR="$demo/$name/visits" OPENBARK_TEMPLATES_DIR="$demo/$name/templates" \
              OPENBARK_USERS_FILE="$demo/$name/users.json" OPENBARK_LOCATIONS_FILE="$demo/$name/locations.json" \
              OPENBARK_ENGINES_DIR="$demo/$name/engines" OPENBARK_CONNECTIONS_DIR="$demo/$name/connections" \
              OPENBARK_SYNC_SECRETS_DIR="$demo/$name/sync-secrets" OPENBARK_MODELS_DIR="$HOME/models" \
              OPENBARK_DATA_KEY="$(head -c 32 /dev/urandom | base64)" \
              OPENBARK_SYNC_PREVIEW=1 OPENBARK_SYNC_INTERVAL_SECS=5 OPENBARK_LOG=info "$@" \
              target/release/openbark serve --port "$port" --ui-dir "$demo/ui" >> "$demo/$name.log" 2>&1 &
            echo $! > "$demo/$name.pid"
            for _ in $(seq 1 150); do curl -fs "http://127.0.0.1:$port/api/status" > /dev/null && return; sleep 0.2; done
            echo "$name didn't start"; tail -50 "$demo/$name.log"; exit 1
          }
          start_hub() {
            start hub 4335 OPENBARK_DATA_KEY="$hub_key" OPENBARK_HUB_RATE_IP_PER_MIN=1500 \
              OPENBARK_HUB_RATE_ACCOUNT_PER_MIN=600 OPENBARK_HUB_CODE_TTL_SECS=60
          }
          start_hub
          start phone 4336 OPENBARK_PLATFORM=ios OPENBARK_DEVICE_RAM_GB=8
          start computer 4337
          curl -fs http://127.0.0.1:4336/api/status | jq -e '.profile == "ios"' > /dev/null
          curl -fs http://127.0.0.1:4337/api/status | jq -e '.profile != "ios"' > /dev/null
          export OPENBARK_HUB_E2E_WAV="$PWD/packages/eval/fixtures/audio/smoke.wav" \
            OPENBARK_HUB_E2E_LLM=gemma-4-e2b-it-q4_0 \
            OPENBARK_HUB_E2E_A_NAME="Dr Rivera's iPhone" OPENBARK_HUB_E2E_B_NAME="Exam room computer" \
            OPENBARK_HUB_E2E_B_VISITS="$demo/computer/visits" \
            OPENBARK_HUB_E2E_STATE="$demo/state.json" \
            OPENBARK_HUB_E2E_HUB_DIR="$demo/hub/visits/.openbark/hub" \
            OPENBARK_HUB_E2E_HUB_KEY="$hub_key" \
            OPENBARK_HUB_E2E_BIN="$PWD/target/release/openbark" \
            OPENBARK_HUB_RATE_IP_PER_MIN=1500 OPENBARK_HUB_RATE_ACCOUNT_PER_MIN=600 OPENBARK_HUB_CODE_TTL_SECS=60
          step() {
            echo "::group::$1"
            python3 -I scripts/hub-e2e.py "$1" | tee -a "$demo/steps.log"
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            return "$rc"
          }
          for s in setup basic offline offline2; do step "$s"; done
          # The hub computer restarts: same certificate, same store, devices carry on.
          kill "$(cat "$demo/hub.pid")"
          for _ in $(seq 1 50); do kill -0 "$(cat "$demo/hub.pid")" 2>/dev/null || break; sleep 0.2; done
          echo "--- hub restarted ---" >> "$demo/hub.log"
          start_hub
          for s in restarted remove recover check attacks; do step "$s"; done
          { echo '### Hub end to end (hub, phone and computer)'; echo '```'; cat "$demo/steps.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          # Synthetic data and logs only.
          name: hub-e2e
          path: |
            target/hub-e2e/*.log
            target/hub-e2e/state.json
