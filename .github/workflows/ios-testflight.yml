# Signed iPhone builds uploaded to TestFlight (ADR-0018 section 8). On a
# version tag, or started by hand. Without the signing secrets it skips
# cleanly with a notice: docs/runbooks/ios.md says how the Account Holder
# makes them on Windows and adds them.
#
# Secrets (repository or `testflight` environment):
#   IOS_CERTIFICATE           Apple Distribution certificate, .p12, base64
#   IOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_DEVELOPMENT_TEAM    the 10-character Team ID
#   APPLE_API_ISSUER          App Store Connect API issuer id
#   APPLE_API_KEY             App Store Connect API key id
#   APPLE_API_KEY_P8          the key's .p8 file, base64
# Optional:
#   IOS_MOBILE_PROVISION      an App Store provisioning profile, base64. Without
#                             it Xcode fetches one with the API key.
name: iOS TestFlight

on:
  push:
    tags: ["v*"]
    # Development branches: only a commit whose message contains
    # [ios-testflight] (the job's condition below). The `testflight`
    # environment's rules keep the secrets to main and v* tags.
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo features for the build (default: stt, so the phone transcribes)"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.22.0"
  # TestFlight builds offer the encrypted sync preview (ADR-0017); release
  # installers don't until the hosted project and the security review are done.
  OPENBARK_SYNC_PREVIEW: "1"

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    if: >-
      github.repository == 'ANI-ML/openbark-dev' && (
        github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[ios-testflight]')
      )
    runs-on: macos-15
    timeout-minutes: 90
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Signing secrets present?
        id: secrets
        run: |
          missing=""
          for v in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::Signing secrets not set:$missing. See docs/runbooks/ios.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
      - name: gen/apple is committed
        if: steps.secrets.outputs.ok == 'true'
        run: |
          [ -d apps/desktop/src-tauri/gen/apple ] || {
            echo "::error::apps/desktop/src-tauri/gen/apple isn't committed. Run the iOS init job and commit its artifact."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.secrets.outputs.ok == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Rust target for iPhone
        if: steps.secrets.outputs.ok == 'true'
        run: rustup target add aarch64-apple-ios
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-release/${{ github.repository }}/${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ios-release-
      # The speech models the app ships (ADR-0018 section 10), checked against
      # the catalog's sizes and SHA-256 (Tauri refuses to build without them).
      - name: Restore the bundled speech models
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ios-models
          key: ios-models-${{ hashFiles('engine/os-models/catalog.json', 'scripts/ci/ios-models.py') }}
      - name: The bundled speech models (pinned sizes and SHA-256)
        if: steps.secrets.outputs.ok == 'true'
        run: python3 scripts/ci/ios-models.py build/ios-models
      # sherpa-onnx's iOS library (v1.13.8, pinned) linked into the Xcode
      # project, so the phone transcribes (ADR-0018 sections 1 and 10).
      - name: sherpa-onnx for iOS and the Xcode project
        if: steps.secrets.outputs.ok == 'true'
        run: bash scripts/ci/ios-prepare.sh
      - name: App Store Connect API key on disk
        if: steps.secrets.outputs.ok == 'true'
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - name: Build and sign (app-store-connect)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/desktop
        run: |
          features="${{ inputs.features }}"
          # The phone records and transcribes: stt unless other features are named.
          [ -n "$features" ] || features=stt
          args=(tauri ios build --export-method app-store-connect --ci --build-number "${{ github.run_number }}")
          [ -n "$features" ] && args+=(--features "$features")
          pnpm "${args[@]}"
          ls -la src-tauri/gen/apple/build/arm64/
          echo "IPA: $(du -k src-tauri/gen/apple/build/arm64/*.ipa | cut -f1) KB, with the speech models inside" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ok == 'true'
        run: |
          ipa="$(ls apps/desktop/src-tauri/gen/apple/build/arm64/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Drop the resource copies from target/
        if: always() && steps.secrets.outputs.ok == 'true'
        run: find target -maxdepth 3 -type d -name models -path '*apple-ios*' -prune -exec rm -rf {} + || true
      - name: Remove the key and the certificate
        if: always() && steps.secrets.outputs.ok == 'true'
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security list-keychains -d user || true
