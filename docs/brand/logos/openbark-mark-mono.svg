<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OpenBark">
  <!-- Monochrome mark. Uses currentColor so it inherits the surrounding text colour. Grille slots are cut out (transparent). -->
  <defs>
    <mask id="grille">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="42" y="44" width="16" height="4" rx="2" fill="#000"/>
      <rect x="42" y="52" width="16" height="4" rx="2" fill="#000"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <circle cx="30" cy="20" r="7.5"/>
    <circle cx="50" cy="12" r="7.5"/>
    <circle cx="70" cy="20" r="7.5"/>
    <rect x="35" y="28" width="30" height="42" rx="15" mask="url(#grille)"/>
    <rect x="46.5" y="78" width="7" height="10" rx="3.5"/>
    <rect x="35" y="87" width="30" height="7" rx="3.5"/>
  </g>
  <path d="M24 54 A26 26 0 0 0 76 54" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
</svg>
