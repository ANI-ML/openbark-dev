<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 80" width="372" height="80" role="img" aria-label="OpenBark">
  <!-- Horizontal lockup. Wordmark is live text in Manrope (load the font, or convert to outlines before shipping to places that can't load fonts). -->
  <style>
    .word { font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 60px; letter-spacing: -1.8px; fill: #182230; }
    .open { font-weight: 500; }
    .bark { font-weight: 800; }
  </style>
  <g transform="translate(4 4) scale(0.72)">
    <circle cx="30" cy="20" r="7.5" fill="#182230"/>
    <circle cx="50" cy="12" r="7.5" fill="#182230"/>
    <circle cx="70" cy="20" r="7.5" fill="#182230"/>
    <rect x="35" y="28" width="30" height="42" rx="15" fill="#E27A2B"/>
    <rect x="42" y="44" width="16" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="42" y="52" width="16" height="4" rx="2" fill="#FFFFFF"/>
    <path d="M24 54 A26 26 0 0 0 76 54" fill="none" stroke="#182230" stroke-width="7" stroke-linecap="round"/>
    <rect x="46.5" y="78" width="7" height="10" rx="3.5" fill="#182230"/>
    <rect x="35" y="87" width="30" height="7" rx="3.5" fill="#182230"/>
  </g>
  <text class="word" x="92" y="60"><tspan class="open">open</tspan><tspan class="bark">bark</tspan></text>
</svg>
