name = "owner-mention"
regex = '(?i)\bproduct owner\b'
reason = "Remaining mentions of the product owner. Fine as a role in an ADR (deciders, approvals); review anything personal. ('owner' alone usually means the animal's owner and is not listed.)"
binary = false
scan_paths = false

# Secret patterns, always run (gitleaks also runs when found).
[[gate.secret]]
name = "aws-access-key"
regex = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
reason = "AWS access key id."

[[gate.secret]]
name = "github-token"
regex = '\bgh[pousr]_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{60,}\b'
reason = "GitHub token."

[[gate.secret]]
name = "private-key-block"
regex = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
reason = "Private key material."

[[gate.secret]]
name = "slack-token"
regex = '\bxox[abposr]-[A-Za-z0-9-]{10,}'
reason = "Slack token."

[[gate.secret]]
name = "google-api-key"
regex = '\bAIza[0-9A-Za-z_-]{35}\b'
reason = "Google API key."

[[gate.secret]]
name = "stripe-key"
regex = '\b(?:sk|rk)_live_[0-9A-Za-z]{20,}'
reason = "Stripe live key."

[[gate.secret]]
name = "sendgrid-key"
regex = '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
reason = "SendGrid API key."

[[gate.secret]]
name = "twilio-key"
regex = '\bSK[0-9a-f]{32}\b|\bAC[0-9a-f]{32}\b'
reason = "Twilio API key SID or account SID."

[[gate.secret]]
name = "jwt"
regex = '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
reason = "JSON Web Token (for example a Supabase service key)."

[[gate.secret]]
name = "openai-hf-keys"
regex = '\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}|\bhf_[A-Za-z0-9]{30,}\b'
reason = "OpenAI-style or Hugging Face token."

[[gate.secret]]
name = "assigned-secret"
regex = '(?i)\b(?:password|passwd|secret|api[_-]?key|token)\s*[:=]\s*["\x27][^"\x27\s$<{]{12,}["\x27]'
reason = "A literal credential assigned in code or config."
