# ------------------------------------------------------------------- gate

[gate]
# The first path that exists is used, then `gitleaks` on PATH. When none is
# found the built-in secret regexes below still run.
gitleaks = [
  "C:/Users/sshuser/AppData/Local/Temp/claude/c--Users-sshuser-Documents/ef729326-7284-4605-972d-e4bbd2a71a0b/scratchpad/public-audit/gitleaks/gitleaks.exe",
]
# `<path in the export>:<gitleaks rule>:<line>`. Each one was checked by hand.
gitleaks_allow_fingerprints = [
  # The twilio-node test fixture. Its SIDs and tokens are stored split, so no
  # line holds a credential-shaped string, but gitleaks still decodes the base64
  # token payloads (17, 21) and finds the made-up SK0123... SID inside, and it
  # scores the prefix-less made-up key SID (5) as a generic key. The tokens were
  # signed with the made-up secret "fixture-secret-not-a-real-key-000".
  "engine/os-connect/fixtures/twilio-node-access-tokens.json:generic-api-key:5",
  "engine/os-connect/fixtures/twilio-node-access-tokens.json:twilio-api-key:17",
  "engine/os-connect/fixtures/twilio-node-access-tokens.json:twilio-api-key:21",
  # A git blob SHA-1 in the pinned test-model file list.
  "scripts/mlx-test-env.sh:generic-api-key:53",
  # The portal's Supabase publishable key (sb_publishable_...), public by design:
  # every visitor's browser receives it, and row level security protects the data.
  "website/src/portal.js:generic-api-key:18",
  "website/dist/portal.js:generic-api-key:18",
]

# Reviewed exceptions. Each names one pattern, the files and the exact text.

[[gate.allow]]
pattern = "supabase-project-ref"
files = ["website/src/portal.js", "website/dist/**", "scripts/website-build.py", "vercel.json", "website/vercel.json", "apps/desktop/e2e/website.mjs", "docs/network.md", "supabase/README.md", "supabase/functions/delete-account/index.ts"]
context = 'https://nmecovtmijnfnjuadicp\.supabase\.co|sb-nmecovtmijnfnjuadicp-auth-token|`nmecovtmijnfnjuadicp\.supabase\.co`|--project-ref nmecovtmijnfnjuadicp|^Project: `nmecovtmijnfnjuadicp`'
reason = "The account portal's Supabase project. Its URL and session key are in the live website's code that every visitor downloads, the CSP must name it, and docs/network.md must list every host. Decided fine to publish; the scrubs that hide it in ADR-0017, M3 and the sync line of docs/network.md remain, because those passages are about plans."

[[gate.allow]]
pattern = "openai-hf-keys"
files = ["apps/desktop/src/components/HfTokenField.test.tsx", "engine/os-engine/src/secrets.rs"]
context = '"hf_abcdefghijklmnopqrstuvwxyz0123"'
reason = "A made-up Hugging Face token (the alphabet) used by tests."

[[gate.allow]]
pattern = "assigned-secret"
files = ["apps/desktop/src/components/HfTokenField.test.tsx"]
context = '"hf_abcdefghijklmnopqrstuvwxyz0123"'
reason = "The same made-up test token."

[[gate.allow]]
pattern = "internal-projects"
files = ["apps/desktop/public/help/*.webm"]
context = '^ARC$'
reason = "Three bytes inside compressed video data, not text: the binary scan matches the whole word ARC anywhere. Every Help video was checked frame by frame (a frame every 3 s), and the audit scans each file for every internal name, not only the first match."

