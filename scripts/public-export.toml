# Reviewed rules for scripts/public-export.py.
#
# The public source repository starts from one fresh commit built by that
# script. Everything it removes or rewrites is listed here, with the reason,
# so a reviewer can read one file and know exactly how the public tree differs
# from this repository. docs/plans/public-repo.md explains the process.
#
# Rule kinds:
#   [[exclude]]  files never published (globs; `**` spans folders).
#   [[blocker]]  something only the owner can resolve. action = "exclude"
#                keeps the files out until it is resolved; "keep" just lists
#                the blocker. While any blocker remains the script exits 3.
#   [[scrub]]    exact text replacements in the exported copy. `find` is a
#                literal string unless regex = true. A rule must match at
#                least once (or exactly `expect` times), otherwise the export
#                stops: the source changed and the rule needs another review.
#   [gate]       final check of the exported tree. Any `fail` or `secret`
#                match fails the export; `warn` matches are listed for review.
#
# This file is private tooling and is itself excluded from the export. It is
# the one place that spells out the forbidden words, because the gate has to
# search for them.

[export]
ref = "HEAD"
required_files = [
  "LICENSE",
  "NOTICE",
  "README.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "CHANGELOG.md",
  ".gitignore",
  ".gitattributes",
]

# --------------------------------------------------------------- excludes

[[exclude]]
paths = ["CLAUDE.md"]
reason = "Working notes for the AI coding assistant used during development. Internal, and it names the tool."

[[exclude]]
paths = ["OPENSCRIBE_CLAUDE_CODE_PROMPT.md"]
reason = "The original product brief, written as a prompt for the AI coding assistant. Internal; contains open decisions for the owner and a competitor feature and pricing comparison."

[[exclude]]
paths = ["**/.claude/**", "**/CLAUDE.md", "**/CLAUDE.local.md", "**/AGENTS.md", "**/.cursor/**", "**/.aider*", "**/.windsurf/**", "**/.continue/**", "**/.github/copilot-instructions.md"]
reason = "AI assistant settings, skills and instruction files, if any are ever committed."

[[exclude]]
paths = ["**/*scratch*/**", "**/*scratchpad*", "**/*.bak", "**/*.orig", "**/*.rej", "**/*.log", "**/*.tmp", "**/__pycache__/**", "**/*.pyc", "**/.env", "**/.env.*", "**/*.pem", "**/*.p12", "**/*.pfx", "**/*.p8", "**/*.key"]
reason = "Scratch files, editor and merge leftovers, logs, Python caches, environment files and key material, if any are ever committed."

[[exclude]]
paths = [".github/workflows/download-stats.yml", "scripts/download-stats.py"]
reason = "The daily download-stats job runs only in the private development repo (docs/network.md B7 says so). In the public copy its schedule would run too and push a public `stats` branch, which the published-copy model (one commit per release) does not allow."

[[exclude]]
paths = [".github/dependabot.yml"]
reason = "Dependency updates are handled in the development repo; the public copy would otherwise open update pull requests that are never merged there."

[[exclude]]
paths = ["scripts/public-export.py", "scripts/public-export.toml", "docs/plans/public-repo.md"]
reason = "This export tooling and its report. Private process documents; the config necessarily spells out the forbidden words the gate searches for."

# --------------------------------------------------------------- blockers
# None. The three earlier blockers were resolved by owner decisions:
#   help-videos       re-recorded with neutral C:\OpenBark-demo folders; frames
#                     checked; exported again.
#   public-repo-name  the public repo is ANI-ML/openbark; the private one is
#                     renamed ANI-ML/openbark-dev, so github.com/ANI-ML/openbark
#                     links stay correct.
#   public-repo-role  the public repo is a published copy, one clean commit per
#                     release authored as ANI.ML Health; development stays
#                     private and outside pull requests are ported by hand. The
#                     docs that describe this were reworded in the private repo.

