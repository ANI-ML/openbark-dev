# OpenBark template: dental procedure (COHAT) record.
id: dental
version: 0.1.0
name: Dental procedure
description: Oral exam under anaesthesia, findings by tooth, treatment and home care.
language: en

instructions: |
  Write the medical record for this dental procedure (comprehensive oral health assessment and treatment).
  Use concise clinical veterinary English as a veterinarian would chart it.
  Refer to teeth by the modified Triadan number or name exactly as said (e.g. 108, "upper left fourth premolar").
  The transcript is from a recording; speakers are labelled by number, not role. Infer roles from context,
  but never put words in a speaker's mouth.

rules:
  - "Each tooth finding is one statement naming the tooth exactly as said, with the finding (missing, fractured, mobility grade, pocket depth, periodontal stage, resorption, other)."
  - "Record a periodontal stage, mobility grade or pocket depth only if it was said."
  - "Nerve blocks and anaesthetic drugs are medications: drug, dose, route and site as said."

sections:
  - id: patient
    title: Patient
    presence: optional
    kind: fields
    fields:
      - { key: name, label: Name }
      - { key: species, label: Species }
      - { key: breed, label: Breed }
      - { key: age, label: Age }
      - { key: sex, label: Sex }
  - title: Indication
    kind: statements
    presence: required
  - title: Conscious oral exam
    kind: statements
  - title: Anaesthesia and nerve blocks
    examples:
      - "Name each nerve block with its side and volume"
    kind: medications
  - title: Anaesthetic monitoring
    kind: statements
    instruction: Monitoring values and events during anaesthesia as said.
  - title: Dental radiographs
    examples:
      - "Mention which teeth showed resorption on radiographs"
    kind: statements
  - title: Findings by tooth
    examples:
      - "Use the Triadan number for every tooth"
      - "One tooth per line, in numerical order"
      - "Include pocket depths in mm when they were called out"
    kind: statements
    presence: required
  - title: Overall periodontal status
    kind: statements
  - title: Treatment performed
    examples:
      - "Name the extraction technique for each tooth (simple or surgical)"
      - "List gingival closures with suture used"
    kind: statements
    instruction: Scaling, polishing, extractions (tooth and technique), closures, and other procedures, by tooth.
  - title: Medications to go home
    kind: medications
  - title: Home care and follow-up
    examples:
      - "Include the soft-food duration in days"
    kind: statements
    instruction: Diet, brushing, chews and recheck timing as said.
