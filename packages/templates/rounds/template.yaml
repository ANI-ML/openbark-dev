# OpenBark template: clinician rounds (hospitalised patient handover).
id: rounds
version: 0.1.0
name: Clinician rounds
description: "Handover of a hospitalised patient: status since last rounds, treatments, plan and tasks for the day."
icon: users-three
language: en

instructions: |
  Write the rounds record for a hospitalised patient: the handover between clinicians, technicians and
  shifts.
  Use concise clinical veterinary English as a veterinarian would chart it.
  The transcript is from a recording; speakers are labelled by number, not role. Infer roles from context,
  but never put words in a speaker's mouth.
  Rounds often cover several patients. When the visit lists more than one animal, write only about the
  animal this note is for.

rules:
  - "Record times of events, treatments and observations only as said."
  - "Every drug, fluid rate and infusion is a medication: dose or rate, route and frequency as said."
  - "A task belongs under To do with who will do it and when, only if said."
  - "Record resuscitation status only as stated."

sections:
  - id: patient
    title: Patient
    presence: optional
    kind: fields
    fields:
      - { key: name, label: Name }
      - { key: species, label: Species }
      - { key: day_in_hospital, label: Day in hospital }
  - title: Problem summary
    kind: statements
    presence: required
    instruction: Why the patient is in hospital and the main problems.
  - title: Since last rounds
    kind: statements
    instruction: Overnight or since-last-shift events, as said.
    examples:
      - "Put the time in front of each event"
  - title: Current status
    kind: fields
    fields:
      - { key: temperature, label: Temperature }
      - { key: heart_rate, label: HR }
      - { key: respiratory_rate, label: RR }
      - { key: pain_score, label: Pain score }
      - { key: appetite, label: Appetite }
      - { key: urine_output, label: Urine output }
      - { key: weight, label: Weight }
  - title: Current treatments
    kind: medications
    examples:
      - "Give fluid rates in mL/h"
  - title: Diagnostics
    kind: statements
    instruction: New results, and tests pending or planned.
  - title: Assessment
    kind: text
    instruction: How the patient is doing overall, in the clinicians' words.
  - title: Plan for today
    kind: statements
  - title: To do
    kind: statements
    instruction: Tasks for the shift, with who and when if said.
    examples:
      - "One task per line, with who will do it"
  - title: Client communication
    kind: statements
    instruction: Updates given to the owner, and when the next is due.
  - title: Resuscitation status
    kind: statements
