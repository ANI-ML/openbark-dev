lines:
  - [dvm, "This is Luna, a one year old female Labrador, here for an ovariohysterectomy. She was fasted overnight."]
  - [tech, "Weight twenty-four point five kilos, temp thirty-eight point six, heart rate one hundred, resp rate twenty. Bloodwork was normal."]
  - [dvm, "ASA one. Premed is hydromorphone point one milligrams per kilo IM with acepromazine point zero two milligrams per kilo IM."]
  - [tech, "Induced with propofol, four milligrams per kilo IV, intubated, maintained on isoflurane. Lactated Ringer's at five mils per kilo per hour."]
  - [dvm, "Ventral midline incision, about six centimetres. Both ovarian pedicles ligated with two oh PDS, uterine body ligated the same."]
  - [tech, "Blood pressure dipped to a mean of fifty-eight around the uterine body, came back up after I turned the iso down."]
  - [dvm, "Linea closed with two oh PDS simple continuous, subcutaneous with three oh Monocryl, and an intradermal skin closure."]
  - [dvm, "No other complications. She extubated smoothly. Pain score two out of ten in recovery."]
  - [dvm, "Home with carprofen, four point four milligrams per kilo once a day for five days. Cone on for fourteen days, leash walks only."]
  - [dvm, "Recheck the incision in ten to fourteen days. No sutures to remove since it's intradermal."]

