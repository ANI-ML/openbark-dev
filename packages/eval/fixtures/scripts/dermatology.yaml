# Synthetic consult: written for OpenBark's test suite; not a real patient.
id: dermatology
title: Itchy dog with ear infection, dermatology workup
species: canine
template: dermatology
speakers:
  dvm: af_sarah
  client: am_michael
pause_secs: 0.6
lines:
  - [client, "Bailey's been scratching like crazy for about three months. It gets worse every summer. She's a four year old Golden Retriever."]
  - [dvm, "On a scale of zero to ten, how itchy would you say she is?"]
  - [client, "Honestly, an eight. She keeps us up at night."]
  - [dvm, "Is she on flea prevention, and has the diet changed?"]
  - [client, "She gets her flea chew every month. Same food for two years."]
  - [dvm, "She has redness and hair loss on her paws, armpits and belly. A few small red bumps on the belly too."]
  - [dvm, "The left ear is red with brown discharge. The right ear looks normal."]
  - [dvm, "Ear cytology from the left ear shows yeast, about ten per field, and no bacteria. Tape cytology from the paws shows yeast as well."]
  - [dvm, "This looks like environmental allergies, atopic dermatitis, with a secondary yeast infection. A food allergy is less likely but possible."]
  - [dvm, "Start oclacitinib, sixteen milligrams by mouth twice a day for fourteen days, then once a day."]
  - [dvm, "Clean the left ear and use the ear drops once a day for ten days. Chlorhexidine shampoo twice a week, leave it on for ten minutes."]
  - [dvm, "Recheck in three weeks, and we'll look at the ear again."]

expected:
  medications:
    - { drug: oclacitinib, dose: "16", duration: "14" }
  must_mention: [yeast, atopic, chlorhexidine, "ten minutes", "three weeks", left ear]
  must_not_mention: [skin scraping, bacteria present]
