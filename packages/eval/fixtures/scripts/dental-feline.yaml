# Synthetic consult: written for OpenBark's test suite; not a real patient.
# Feline dental chart fixture (ADR-0021, plan step 15): tooth resorption stage
# and type said on different lines, a crown amputation, a tooth said only by
# name, gingival recession in millimetres, and "no other resorptive lesions".
#
# expected.chart: one fact per item; see dental-chart.yaml for how items match.
# `cites`: the transcript line the item cites must contain these words.
id: dental-feline
title: Feline dental with tooth resorption, charted
species: feline
template: dental
# As the clinic enters it before the visit; the app sends it with every draft.
patient: { name: Pepper, reason: Dental, species: Cat }
speakers:
  dvm: am_michael
  tech: af_nicole
pause_secs: 0.6
lines:
  - [dvm, "This is Pepper, a twelve year old neutered male domestic shorthair, here for his dental."]
  - [tech, "He's four point eight kilos. Buprenorphine and alfaxalone, and he's on isoflurane."]
  - [dvm, "Left caudal mandibular block, point two mils of bupivacaine."]
  - [dvm, "Three oh seven has tooth resorption, stage four b."]
  - [dvm, "On the radiograph, three oh seven is type two, replacement resorption."]
  - [dvm, "Four oh eight has a stage two resorptive lesion, type one."]
  - [dvm, "Two oh six is missing, and the upper left canine looks healthy."]
  - [dvm, "One oh nine has two millimetres of gingival recession."]
  - [dvm, "No other resorptive lesions on the full-mouth films."]
  - [dvm, "Three oh seven gets a crown amputation, since it's type two. Four oh eight is extracted surgically."]
  - [dvm, "Buprenorphine at home, point zero two milligrams per kilo in the mouth every eight hours for three days."]
  - [dvm, "Recheck in two weeks."]

expected:
  vitals:
    weight: "4.8"
  medications:
    - { drug: bupivacaine, dose: "0.2" }
    - { drug: buprenorphine, dose: "0.02", duration: "3" }
  must_mention: ["307", "408", "two weeks"]
  must_not_mention: [stage 4 periodontal]
  chart:
    - { tooth: "307", finding: resorption, grade: 4, detail: crown_worse }
    - { tooth: "307", finding: resorption_type, grade: 2, cites: "radiograph" }
    - { tooth: "307", finding: crown_amputation, planned: false }
    - { tooth: "408", finding: resorption, grade: 2 }
    - { tooth: "408", finding: resorption_type, grade: 1 }
    - { tooth: "408", finding: extraction, detail: open, planned: false }
    - { tooth: "206", finding: missing }
    # Said only by name: "the upper left canine".
    - { tooth: "204", finding: normal }
    - { tooth: "109", finding: gingival_recession, mm: 2 }
  chart_flags: []
  chart_not_allowed:
    # "No other resorptive lesions" never goes on teeth.
    - { finding: resorption, except: ["307", "408"] }
    - { finding: resorption_type, except: ["307", "408"] }
    - { finding: normal, except: ["204"] }
