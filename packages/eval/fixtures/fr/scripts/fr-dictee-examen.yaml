id: fr-dictee-examen
title: Examen dicté système par système, chat âgé qui boit beaucoup
species: feline
category: fr
speakers:
  dvm: "piper:fr_FR-upmc-medium#1"
  client: "piper:fr_FR-upmc-medium#0"
