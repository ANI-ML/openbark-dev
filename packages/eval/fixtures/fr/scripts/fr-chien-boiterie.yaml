  - [dvm, "La hanche gauche et le jarret sont normaux. Le postérieur droit est normal."]
  - [dvm, "Je soupçonne une lésion du ligament croisé crânial du grasset gauche, ou une entorse."]
  - [dvm, "Je vous propose des radiographies du grasset aujourd'hui, sous sédation."]
  - [client, "D'accord, on fait les radiographies."]
  - [dvm, "En attendant, on lui donne un anti-inflammatoire, le Metacam en suspension buvable, une fois par jour avec le repas, pendant dix jours."]
  - [dvm, "Et du repos strict : seulement des petites promenades en laisse de dix minutes, pas de course ni de saut, pendant deux semaines."]
  - [client, "Ça va être dur pour lui, mais d'accord."]
  - [dvm, "Je vous appelle cet après-midi avec les résultats des radiographies."]

