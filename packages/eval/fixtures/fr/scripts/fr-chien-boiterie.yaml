lines:
  - [dvm, "Bonjour. Qu'est-ce qui arrive à Oscar ?"]
  - [client, "Il boite de la patte arrière gauche depuis trois jours. Ça a commencé après une course au parc."]
  - [dvm, "Il pose la patte par terre, ou il la garde en l'air ?"]
  - [client, "Il la pose un peu, mais il boite beaucoup le matin, quand il se lève."]
  - [dvm, "Il a déjà eu des problèmes d'articulations ? Il prend des médicaments en ce moment ?"]
