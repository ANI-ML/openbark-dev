[package]
name = "os-asr"
description = "Speech-to-text and VAD for the OpenBark engine (sherpa-onnx)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# os-asr is the only crate that depends on sherpa-onnx directly; others use
# the `os_asr::sherpa_onnx` re-export, so the link mode is decided once, here.
#
# Windows: the prebuilt static libs use the static CRT (/MT) and fail to link
# next to llama.cpp (/MD) with LNK2038, so use DLLs (spike S2, finding 1).
# Linux: the prebuilt static libs (GCC 11) carry weak libstdc++ std::regex
# instantiations that replace GCC 13's in llama.cpp's common library, which
# then aborts at start-up with std::bad_alloc; the .so files keep their own
# copies (ADR-0001, amendment of 2026-10-18). The binaries find them through an
# $ORIGIN run path set in os-cli's and the desktop app's build scripts.
# Android/iOS: sherpa-onnx only ships shared libraries for mobile.
# macOS stays static: libc++ tags its internal functions per version, so the
# two copies don't collide (and the macOS CI job runs the tests).
[target.'cfg(any(windows, target_os = "linux", target_os = "android", target_os = "ios"))'.dependencies]
sherpa-onnx = { workspace = true, features = ["shared"], optional = true }

[target.'cfg(not(any(windows, target_os = "linux", target_os = "android", target_os = "ios")))'.dependencies]
sherpa-onnx = { workspace = true, features = ["static"], optional = true }

[features]
default = ["stt", "capture"]
# Speech recognition, voice detection and sherpa-onnx's WAV reader and
# resampler. Without it the crate has no native code: recognisers say speech
# recognition isn't in this build, and audio is read and resampled in Rust
# (ADR-0018 section 1).
stt = ["dep:sherpa-onnx"]
# Microphone capture through cpal.
capture = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
# Decoding phone and recorder files (m4a, mp3, caf, flac, ogg) for import; MPL-2.0.
# Every container and codec Symphonia offers (recordings come from phones, dictaphones, browsers and call apps).
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "isomp4", "aac", "alac", "mp1", "mp2", "mp3", "flac", "ogg", "vorbis", "caf", "mkv", "aiff"] }
# Opus (WebM from browsers and call apps, .opus and Ogg Opus voice notes): pure Rust, RFC 8251 conformant.
opus-decoder = "=0.1.1"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Uses sherpa-onnx directly.
[[example]]
name = "hotwords"
required-features = ["stt"]
