[package]
name = "os-app"
description = "OpenBark application layer shared by the desktop app and web mode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
os-asr.workspace = true
# The clinic's own Twilio account (ADR-0023). Its HTTP client stays in os-connect.
os-connect.workspace = true
os-engine.workspace = true
os-llm.workspace = true
os-models.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The loopback fake Twilio for the phone tests (ADR-0023).
os-connect = { workspace = true, features = ["mock"] }
