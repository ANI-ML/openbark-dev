[package]
name = "os-cli"
description = "OpenBark command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openbark"
path = "src/main.rs"

[features]
default = []
cuda = ["os-llm/cuda"]
vulkan = ["os-llm/vulkan"]
metal = ["os-llm/metal"]
# The end-to-end demo only (ADR-0024 plan step 0): OPENBARK_TEST_BUILTINS_DIR
# replaces built-in templates, to simulate a release. Never in release builds.
test-builtins = ["os-engine/test-builtins"]

[dependencies]
os-app.workspace = true
os-asr.workspace = true
os-diar.workspace = true
os-engine.workspace = true
os-llm.workspace = true
os-models.workspace = true
os-server.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
