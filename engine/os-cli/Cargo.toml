[package]
name = "os-cli"
description = "OpenBark command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openbark"
path = "src/main.rs"

[features]
default = []
cuda = ["os-llm/cuda"]
vulkan = ["os-llm/vulkan"]
metal = ["os-llm/metal"]
# Honour OPENBARK_MLX_DEV=1 (MLX on Linux's CPU, for CI and developers) in a
# release build (ADR-0025 §1). Never enabled for the builds clinics get.
mlx-test-mode = ["os-models/mlx-test-mode"]

[dependencies]
os-app.workspace = true
os-asr.workspace = true
os-diar.workspace = true
os-engine.workspace = true
os-llm.workspace = true
os-models.workspace = true
os-server.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
