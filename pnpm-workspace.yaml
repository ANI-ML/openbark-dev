packages:
  - apps/*
  - packages/*

# Versions verified 2026-10-17 (docs/versions.md). Exact pins: many are days old.
catalog:
  turbo: 2.11.9
  typescript: 6.0.3
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  vitest: 5.0.5
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  # jsdom 30 needs Node >=24.15; 29.x supports the Node 24.14 on dev machines.
  jsdom: 29.1.1
  "@playwright/test": 1.64.1
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.3
  "@tauri-apps/plugin-dialog": 2.8.3
  "@tauri-apps/plugin-opener": 2.7.2
  # Brand guide §6 (docs/brand/DESIGN.md, ADR-0016): Lucide icons (ISC), bundled.
  # Manrope and JetBrains Mono (OFL-1.1, fontsource 5.3.0) are vendored in
  # packages/ui/src/fonts, never loaded from a CDN.
  "lucide-react": 1.59.0

# pnpm 11: dependency build scripts are denied unless allowed here.
allowBuilds:
  esbuild: true
