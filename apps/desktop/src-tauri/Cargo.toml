[package]
name = "openbark-desktop"
description = "OpenBark desktop app (Tauri 2)"
# The Linux .deb Maintainer field (tauri-bundler reads package.authors).
authors = ["ANI.ML Health Inc. <we.care@animl.health>"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "openbark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openbark-desktop"
path = "src/main.rs"

[features]
default = []
cuda = ["os-llm/cuda"]
vulkan = ["os-llm/vulkan"]
metal = ["os-llm/metal"]
# Phones only (ADR-0018 sections 1 and 10): transcription with sherpa-onnx's
# xcframework, and drafting with a small GGUF on llama.cpp (with `metal`). Desktop
# builds always have both.
stt = ["os-app/stt"]
inference = ["os-app/inference"]
# CI only, never in the installers: drives the app and quits (src/selftest.rs).
selftest = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
os-models.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Desktop: every engine feature, exactly as before.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
os-app = { workspace = true, features = ["default"] }
os-engine = { workspace = true, features = ["default"] }
os-llm = { workspace = true, features = ["default"] }

# Phones (ADR-0018): recording to the encrypted visit folder first; `stt` and
# `inference` above add the native libraries once each is proven on iOS.
# `sync` is the clinic hub client (ADR-0029); it stays hidden unless the
# build sets OPENBARK_SYNC_PREVIEW. Phones never get os-app's `hub` (the server).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
os-app = { workspace = true, features = ["recorder", "sync"] }
os-engine = { workspace = true, features = ["recorder"] }
os-llm.workspace = true
